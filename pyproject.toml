[project]
name = "ledger-logic-agent"
version = "0.1.0"
description = "AI accounting agent for Tripletex competition"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "google-cloud-aiplatform>=1.49.0",
    "google-genai",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pymupdf>=1.24.0",
]

[project.scripts]
start = "uvicorn main:app --host 0.0.0.0 --port 8000"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
]
